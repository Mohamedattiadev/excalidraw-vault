name: Deploy to GitHub Pages

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Snapshots the two patched plugins, installs, puts them back. Same script
      # the README tells you to run locally, so the two cannot drift apart.
      - name: Install Quartz plugins (patches preserved)
        run: node scripts/install-plugins.mjs

      - name: Quartz build
        run: npx quartz build

      - name: Build self-hosted Excalidraw bundle
        run: node scripts/build-vendor.mjs

      - name: Restore scene extractor cache
        id: scene-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/_scenes
            public/_files
          key: scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-${{ github.run_id }}
          restore-keys: |
            scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-
            scenes-v2-

      - name: Scene extractor + sidebar tree injection
        timeout-minutes: 15
        env:
          SCENE_TIME_BUDGET_MS: "600000"
          SCENE_CHUNK_SIZE: "200"
          SCENE_CHUNK_THRESHOLD: "400"
          SCENE_FILES_PER_RUN: "200"
        run: node scripts/build-excalidraw-viewer.mjs

      - name: Save scene extractor cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            public/_scenes
            public/_files
          key: scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-${{ github.run_id }}

      - name: Re-trigger deploy if scenes incomplete
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .exc-incomplete ]; then
            echo "Scenes incomplete — triggering next deploy"
            gh workflow run pages.yml --ref v5 -R ${{ github.repository }}
          else
            echo "All scenes done."
          fi

      - name: Optimize images (webp + downscale)
        run: node scripts/optimize-images.mjs

      # Must run after everything that emits HTML. The alias plugin only writes
      # `03-os.html`, so `/03-os/` with a trailing slash 404s without this.
      - name: Trailing-slash alias redirects
        run: node scripts/alias-dir-redirects.mjs

      - name: Set base URL for project Pages
        run: |
          # Project pages serve at /<repo>/ — patch <base> + asset paths if needed.
          # Quartz's baseUrl is in quartz.config.yaml; CI override is left to user.
          echo "Built site at public/"
          ls -la public | head -10

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
