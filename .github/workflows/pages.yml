name: Deploy to GitHub Pages

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Seed git HEAD inside patched plugins (so install-plugins skips re-clone)
        run: |
          for d in .quartz/plugins/explorer .quartz/plugins/obsidian-plugin-excalidraw; do
            if [ -d "$d" ] && [ ! -d "$d/.git" ]; then
              ( cd "$d" && git init -q && git config user.email ci@local && git config user.name ci && git add -A && git commit -q -m "snapshot" --allow-empty )
            fi
          done

      - name: Snapshot patched plugins (defensive)
        run: |
          mkdir -p /tmp/plugin-patch
          cp -a .quartz/plugins/explorer /tmp/plugin-patch/
          cp -a .quartz/plugins/obsidian-plugin-excalidraw /tmp/plugin-patch/

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Restore patched plugins (overlay)
        run: |
          rm -rf .quartz/plugins/explorer .quartz/plugins/obsidian-plugin-excalidraw
          cp -a /tmp/plugin-patch/explorer .quartz/plugins/
          cp -a /tmp/plugin-patch/obsidian-plugin-excalidraw .quartz/plugins/

      - name: Quartz build
        run: npx quartz build

      - name: Build self-hosted Excalidraw bundle
        run: node scripts/build-vendor.mjs

      - name: Restore scene extractor cache
        id: scene-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/_scenes
            public/_files
          key: scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-${{ github.run_id }}
          restore-keys: |
            scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-
            scenes-v2-

      - name: Scene extractor + sidebar tree injection
        timeout-minutes: 15
        env:
          SCENE_TIME_BUDGET_MS: "600000"
          SCENE_CHUNK_SIZE: "200"
          SCENE_CHUNK_THRESHOLD: "400"
          SCENE_FILES_PER_RUN: "200"
        run: node scripts/build-excalidraw-viewer.mjs

      - name: Save scene extractor cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            public/_scenes
            public/_files
          key: scenes-v2-${{ hashFiles('scripts/build-excalidraw-viewer.mjs') }}-${{ github.run_id }}

      - name: Re-trigger deploy if scenes incomplete
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .exc-incomplete ]; then
            echo "Scenes incomplete — triggering next deploy"
            gh workflow run pages.yml --ref v5 -R ${{ github.repository }}
          else
            echo "All scenes done."
          fi

      - name: Optimize images (webp + downscale)
        run: node scripts/optimize-images.mjs

      - name: Set base URL for project Pages
        run: |
          # Project pages serve at /<repo>/ — patch <base> + asset paths if needed.
          # Quartz's baseUrl is in quartz.config.yaml; CI override is left to user.
          echo "Built site at public/"
          ls -la public | head -10

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
